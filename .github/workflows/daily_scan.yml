name: Daily Tech & Opportunity Scan

on:
  schedule:
    # Runs at 00:00 UTC daily (07:00 WIB in Surabaya)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Daily Scan & Send Notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL }}
        run: |
          python src/scan_generator.py --notify

      - name: Commit and Push New Digest
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add digests/
          if git diff --staged --quiet; then
            echo "No new digest changes to commit."
          else
            git commit -m "chore(digest): update daily scan for $(date -u +'%Y-%m-%d')"
            git push
          fi
